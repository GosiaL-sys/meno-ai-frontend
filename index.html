
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menopause Wellness Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2d89ef; color: white; border: none; border-radius: 4px; font-size: 16px; }
        button:hover { background: #1b5dbf; }
        pre { white-space: pre-wrap; background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wellness Plan Generator</h2>
        <form id="wellnessForm">
            <label>Age: <input type="text" name="age" required></label>
            <label>Weight (kg): <input type="text" name="weight" required></label>
            <label>Height (cm): <input type="text" name="height" required></label>
            <label>Ethnicity: <input type="text" name="ethnicity" required></label>
            <label>Symptoms: <input type="text" name="symptoms"></label>
            <label>Hormonal Status: <input type="text" name="hormones"></label>
            <label>Medication: <input type="text" name="medication"></label>
            <label>Diet Preference: <input type="text" name="diet"></label>
            <label>Are you vegetarian? <input type="text" name="vegetarian"></label>
            <label>Skincare Concerns: <input type="text" name="skincareConcerns"></label>
            <button type="submit">Generate Plan</button>
        </form>
        <pre id="response"></pre>
    </div>

    <script>
        document.getElementById('wellnessForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            const response = await fetch('https://meno-ai-app.onrender.com/generate-plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById('response').innerText = result.plan || result.error;
        });
    </script>
</body>
</html>
