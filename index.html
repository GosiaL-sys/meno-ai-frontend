
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menopause Wellness AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f4f8;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #2d89ef;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1b5dbf;
        }
        textarea {
            margin-top: 20px;
            height: 200px;
            background: #f4f4f4;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Personalized Wellness Plan Generator</h2>
        <form id="wellnessForm">
            <label>Age: <input type="number" name="age" required /></label>
            <label>Weight (kg): <input type="number" name="weight" required /></label>
            <label>Height (cm): <input type="number" name="height" required /></label>
            <label>Ethnicity: <input type="text" name="ethnicity" /></label>
            <label>Symptoms: <input type="text" name="symptoms" /></label>
            <label>Hormonal Status: <input type="text" name="hormones" /></label>
            <label>Medication: <input type="text" name="medication" /></label>
            <label>Diet Preference: <input type="text" name="diet" /></label>
            <label>Vegetarian? <input type="text" name="vegetarian" /></label>
            <label>Skincare Concerns: <input type="text" name="skincareConcerns" /></label>
            <button type="submit">Generate Plan</button>
        </form>
        <textarea id="result" readonly placeholder="Your plan will appear here..."></textarea>
    </div>

    <script>
        document.getElementById('wellnessForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            try {
                const response = await fetch('https://meno-ai-app.onrender.com/generate-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.plan) {
                    document.getElementById('result').value = result.plan;
                }

                if (result.pdf_url) {
                    const link = document.createElement('a');
                    link.href = result.pdf_url;
                    link.download = 'wellness_plan.pdf';
                    link.click();
                }

                if (!result.plan && !result.pdf_url) {
                    alert('Error: No PDF or plan returned.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
