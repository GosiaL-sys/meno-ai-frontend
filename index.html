
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menopause Wellness Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 45%;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #2d89ef;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #1b5dbf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Generate Your Wellness Plan</h2>
        <form id="wellnessForm">
            <label>Age:</label>
            <input type="text" name="age" required />

            <label>Weight (kg):</label>
            <input type="text" name="weight" required />

            <label>Height (cm):</label>
            <input type="text" name="height" required />

            <label>Ethnicity:</label>
            <select name="ethnicity" required>
                <option value="">Select one</option>
                <option>Caucasian</option>
                <option>Asian</option>
                <option>African descent</option>
                <option>Hispanic</option>
                <option>Middle Eastern</option>
                <option>Other</option>
            </select>

            <label>Symptoms (select all that apply):</label>
            <div class="checkbox-group">
                <div class="checkbox-item"><input type="checkbox" name="symptoms" value="Hot flashes" /> Hot flashes</div>
                <div class="checkbox-item"><input type="checkbox" name="symptoms" value="Night sweats" /> Night sweats</div>
                <div class="checkbox-item"><input type="checkbox" name="symptoms" value="Mood swings" /> Mood swings</div>
                <div class="checkbox-item"><input type="checkbox" name="symptoms" value="Brain fog" /> Brain fog</div>
                <div class="checkbox-item"><input type="checkbox" name="symptoms" value="Fatigue" /> Fatigue</div>
            </div>

            <label>Skincare Concerns:</label>
            <div class="checkbox-group">
                <div class="checkbox-item"><input type="checkbox" name="skincareConcerns" value="Dry skin" /> Dry skin</div>
                <div class="checkbox-item"><input type="checkbox" name="skincareConcerns" value="Wrinkles" /> Wrinkles</div>
                <div class="checkbox-item"><input type="checkbox" name="skincareConcerns" value="Hair thinning" /> Hair thinning</div>
            </div>

            <label>Other Skin Issues (optional):</label>
            <input type="text" name="skincareOther" />

            <label>Medication:</label>
            <input type="text" name="medication" />

            <label>Diet Preference:</label>
            <select name="diet">
                <option value="">None</option>
                <option>Vegan</option>
                <option>Vegetarian</option>
                <option>Pescatarian</option>
                <option>Halal</option>
            </select>

            <label>Allergies:</label>
            <input type="text" name="allergies" />

            <label>Activity Preferences:</label>
            <textarea name="activity" rows="2"></textarea>

            <label>Blood Test (optional):</label>
            <textarea name="bloodTests" rows="2"></textarea>

            <button type="submit">Generate Plan</button>
        </form>
    </div>

    <script>
        document.getElementById('wellnessForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    data[key] += ', ' + value;
                } else {
                    data[key] = value;
                }
            }

            try {
                const res = await fetch('https://meno-ai-app.onrender.com/generate-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (res.ok && result.pdf) {
                    window.location.href = 'https://meno-ai-app.onrender.com/download/' + result.pdf;
                } else {
                    alert('Error: ' + (result.error || 'No PDF returned'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
